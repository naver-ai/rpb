model:
  id: moonshotai/Moonlight-16B-A3B
  preserve_expert_bias: true
  trust_remote_code: true
  tensor_parallel: 2
  pipeline_parallel: 1
  context_parallel: 1
  expert_parallel: 8
  recompute_granularity: selective
  recompute_modules: [layernorm, moe, moe_act, core_attn]

data:
  root: data/moonlight
  seq_length: 8192
  seed: 42
  memmap_workers: 4
  packed: false
  prompt_template: "{input}{output}"

train:
  iterations: 782
  global_batch_size: 128
  micro_batch_size: 1
  seed: 42

optimizer:
  max_lr: 1.0e-5
  min_lr: 1.0e-6
  warmup_iterations: 40
  weight_decay: 0.1
  adam_beta1: 0.9
  adam_beta2: 0.95
  adam_eps: 1.0e-8
  clip_grad: 1.0
  lr_decay_style: cosine

checkpoint:
  pretrained_checkpoint: checkpoints/moonlight-16b-a3b
  save: outputs/moonlight-rpb
  save_interval: 100

rpb:
  prior_path: artifacts/rpb_prior.pt
  beta: 1.0
  eps: 0.05
  c: 5.0
  route_only: true
